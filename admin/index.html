<!doctype html>
<html lang="en" dir="ltr" data-theme="system" data-title-key="pt.admin">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Admin | Umar BN L Khattob Nursery &amp; Primary School</title>

  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#302078">
  <link rel="manifest" href="../manifest.webmanifest">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="UBK School">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="apple-touch-icon" href="../assets/icons/apple-touch-icon.png">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="Umar BN L Khattob Nursery &amp; Primary School">
  <meta property="og:title" content="Admin | Umar BN L Khattob Nursery &amp; Primary School">
  <meta property="og:description" content="School administration.">

  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Montserrat:wght@500;600;700&family=Poppins:wght@500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Naskh+Arabic:wght@400;600&family=Noto+Sans:wght@400;500;600;700&display=swap">

</head>
<body class="page-admin">
  <a class="skip-link" href="#main" data-i18n="skip">Skip to main content</a>

  <header class="site-header portal-header">
    <div class="container header-row">
      <a class="brand" href="../index.html" aria-label="Back to the school website" data-i18n-attr="aria-label:pt.back">
        <img class="brand-logo" src="../assets/img/logo.jpg" width="46" height="46" alt="School logo">
        <span class="brand-text">
          <strong data-i18n="pt.admin">Portal</strong>
          <small data-i18n="school">Umar BN L Khattob Nursery &amp; Primary School</small>
        </span>
      </a>
      <div class="tools tools-portal">
        <a class="btn btn-soft btn-sm pt-back" href="../index.html"><span data-i18n="pt.site">School website</span></a>
        <div class="seg theme-seg" role="radiogroup" aria-label="Appearance" data-i18n-attr="aria-label:theme.label"></div>
        <select class="select lang-select" aria-label="Language" data-i18n-attr="aria-label:lang.label">
          <option value="en">English</option><option value="ar">العربية</option><option value="ha">Hausa</option>
        </select>
      </div>
    </div>
    <span class="progress" aria-hidden="true"></span>
  </header>


  <main id="main">
<section class="section tight">
      <div class="container">
        <div id="ad-login" lang="en" dir="ltr" class="form-card" style="max-width:460px;margin-inline:auto">
          <h1 style="font-size:1.6rem;margin:0 0 .3rem" data-i18n="pt.admin">Admin portal</h1>
          <p class="sec-lead" style="margin-bottom:1.2rem" data-i18n="ad.login.d">Sign in with your staff account.</p>
          <p class="notice" id="ad-cfg" hidden><span data-icon="alert"></span><span data-i18n="adm.e.cfg"></span></p>
          <form id="ad-form" novalidate>
            <div class="fld"><label for="ad-email" data-i18n="adm.gemail">Email</label><input class="input" id="ad-email" type="email" autocomplete="username" required></div>
            <div class="fld" style="margin-top:1rem"><label for="ad-pass" data-i18n="ad.pass">Password</label><input class="input" id="ad-pass" type="password" autocomplete="current-password" required></div>
            <div class="form-actions" style="margin-top:1.2rem"><button type="submit" class="btn btn-primary" id="ad-go" data-i18n="ad.signin">Sign in</button></div>
            <div class="result" id="ad-result" role="alert" tabindex="-1"></div>
          </form>
        </div>

        <div id="ad-app" lang="en" dir="ltr" data-allow="super_admin,school_admin,admissions_officer,finance_officer,content_editor" hidden>
          <div class="ad-bar"><div><h1 style="font-size:1.5rem;margin:0" data-i18n="pt.admin">Admin portal</h1><p class="count-line" style="margin:.2rem 0 0" id="ad-who"></p></div>
            <button type="button" class="btn btn-soft btn-sm" id="ad-out" data-i18n="ad.signout">Sign out</button></div>
          <div class="ad-shell"><nav class="ad-nav" id="ad-tabs" role="tablist" aria-label="Sections" aria-orientation="vertical"></nav><div class="ad-main">

          <div id="p-overview" role="tabpanel" hidden></div>
          <div id="p-admissions" role="tabpanel" hidden>
            <div class="toolbar">
              <div class="field-search"><span data-icon="search"></span><input id="ad-q" class="input" type="search" placeholder="Search name, reference, phone" autocomplete="off" aria-label="Search applications"></div>
              <select id="ad-fs" class="select-lg" style="width:auto" aria-label="Status"><option value="">All statuses</option></select>
              <select id="ad-fl" class="select-lg" style="width:auto" aria-label="Level"><option value="">All levels</option><option value="nursery">Nursery</option><option value="primary">Primary</option><option value="secondary">Secondary</option></select>
              <span style="flex:1"></span>
              <button type="button" class="btn btn-soft btn-sm" id="ad-csv"><span data-icon="download"></span> Export CSV</button>
              <button type="button" class="btn btn-soft btn-sm" id="ad-reload">Refresh</button>
            </div>
            <p class="count-line" id="ad-count" aria-live="polite"></p>
            <div class="ad-table-wrap"><table class="ad-table" id="ad-table"></table></div>
            <div class="empty" id="ad-empty" hidden><h3>No applications to show.</h3></div>
          </div>
          <div id="p-content" role="tabpanel" hidden></div>
          <div id="p-people" role="tabpanel" hidden></div>
          <div id="p-myclasses" role="tabpanel" hidden></div>
          <div id="p-results" role="tabpanel" hidden></div>
          <div id="p-aitools" role="tabpanel" hidden></div>
          <div id="p-payments" role="tabpanel" hidden></div>
          <div id="p-learning" role="tabpanel" hidden></div>
          <div id="p-pins" role="tabpanel" hidden></div>
          <div id="p-media" role="tabpanel" hidden></div>
          <div id="p-staff" role="tabpanel" hidden></div>
          </div></div>
        </div>
      </div>
    </section>

    <dialog id="ad-dlg" lang="en" dir="ltr" class="dlg" aria-labelledby="ad-dlg-t" style="width:min(820px,96vw)">
      <div class="dlg-head"><h2 id="ad-dlg-t" style="font-size:1.35rem;margin:0"></h2><button type="button" class="round x-btn" style="background:var(--surface-2);color:var(--text)" data-close aria-label="Close"></button></div>
      <div class="dlg-body" id="ad-dlg-b"></div>
    </dialog>
  </main>

  <footer class="portal-footer"><div class="container"><span>&copy; <span id="yr"></span> <span data-i18n="school">Umar BN L Khattob Nursery &amp; Primary School</span></span><a href="../index.html" data-i18n="pt.site">School website</a><a href="../privacy.html" data-i18n="footer.privacy">Privacy notice</a></div></footer>


  <script src="../assets/js/i18n.js"></script>

  <script src="../assets/js/core.js"></script>
  <script src="../assets/js/content.js"></script>
  <script src="../assets/js/public.js"></script>
  <script src="../assets/js/pwa.js"></script>
  <script src="../assets/js/i18n-admissions.js"></script>
  <script src="../assets/js/backend.js"></script>
  <script src="../assets/js/report-sheet.js"></script>
  <script src="../assets/js/admin.js"></script>
  <script src="../assets/js/admin-content.js"></script>
  <script src="../assets/js/admin-people.js"></script>
  <script src="../assets/js/admin-results.js"></script>
  <script src="../assets/js/admin-setup.js"></script>
  <script src="../assets/js/admin-ai.js"></script>
  <script src="../assets/js/admin-finance.js"></script>
  <script src="../assets/js/admin-learning.js"></script>
  <script src="../assets/js/admin-pins.js"></script>
  <script src="../assets/js/admin-media.js"></script>

</body>
</html>
