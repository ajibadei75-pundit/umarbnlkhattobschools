<header class="site-header portal-header">
    <div class="container header-row">
      <a class="brand" href="index.html" aria-label="Back to the school website" data-i18n-attr="aria-label:pt.back">
        <img class="brand-logo" src="assets/img/logo.jpg" width="46" height="46" alt="School logo">
        <span class="brand-text">
          <strong data-i18n="{{portal}}">Portal</strong>
          <small data-i18n="school">Umar BN L Khattob Nursery &amp; Primary School</small>
        </span>
      </a>
      <div class="tools tools-portal">
        <a class="btn btn-soft btn-sm pt-back" href="index.html"><span data-i18n="pt.site">School website</span></a>
        <div class="seg theme-seg" role="radiogroup" aria-label="Appearance" data-i18n-attr="aria-label:theme.label"></div>
        <select class="select lang-select" aria-label="Language" data-i18n-attr="aria-label:lang.label">
          <option value="en">English</option><option value="ar">العربية</option><option value="ha">Hausa</option>
        </select>
      </div>
    </div>
    <span class="progress" aria-hidden="true"></span>
  </header>
